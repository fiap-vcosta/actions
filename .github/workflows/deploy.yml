name: deploy

on:
  workflow_call:
    inputs:
      image_name:
        description: Nome da imagem no Artifact Registry (sem registry/tag)
        type: string
        required: true
      deployment_name:
        description: Nome do Deployment no cluster
        type: string
        required: true
      smoke_url:
        description: URL HTTPS para smoke após o rollout
        type: string
        required: true
      k8s_namespace:
        description: Namespace Kubernetes
        type: string
        required: false
        default: tech-challenge
      image_tag:
        description: Tag da imagem a aplicar
        type: string
        required: false
        default: latest
      sync_app_secret:
        description: Criar/atualizar o Secret Kubernetes da app a partir do Secret Manager e org secrets
        type: boolean
        required: false
        default: true
      k8s_secret_name:
        description: Nome do Secret no cluster (default = deployment_name)
        type: string
        required: false
        default: ""
      connection_string_sm_secret:
        description: Id do secret no Secret Manager com ConnectionStrings__DefaultConnection (vazio = omitir)
        type: string
        required: false
        default: ""
      service_auth_sm_secret:
        description: Id do secret no Secret Manager com ServiceAuth__Key (vazio = usar org secret SERVICE_AUTH_KEY)
        type: string
        required: false
        default: ""
      jwt_signing_key_sm_secret:
        description: Id do secret no Secret Manager com Jwt__SigningKeyPem (vazio = omitir)
        type: string
        required: false
        default: ""
      mercado_pago_access_token_sm_secret:
        description: Id do secret no Secret Manager com MercadoPago__AccessToken (vazio = omitir)
        type: string
        required: false
        default: ""
      mercado_pago_webhook_secret_sm_secret:
        description: Id do secret no Secret Manager com MercadoPago__WebhookSecret (vazio = omitir)
        type: string
        required: false
        default: ""
    secrets:
      DD_API_KEY:
        description: API key Datadog (org)
        required: false
      SERVICE_AUTH_KEY:
        description: Fallback de X-Service-Key quando service_auth_sm_secret está vazio
        required: false

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy no GKE
    runs-on: ubuntu-latest
    env:
      K8S_NAMESPACE: ${{ inputs.k8s_namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required org vars
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
          GCP_GKE_CLUSTER_NAME: ${{ vars.GCP_GKE_CLUSTER_NAME }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION GCP_AR_REPOSITORY GCP_GKE_CLUSTER_NAME \
                      GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "org vars faltando: ${missing[*]}" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Credenciais do cluster
        run: |
          gcloud container clusters get-credentials "${{ vars.GCP_GKE_CLUSTER_NAME }}" \
            --region "${{ vars.GCP_REGION }}" --dns-endpoint

      - name: Namespace e service account
        run: |
          set -euo pipefail
          if [[ -f k8s/namespace.yaml ]]; then
            kubectl apply -f k8s/namespace.yaml
          fi
          if [[ -f k8s/serviceaccount.yaml ]]; then
            kubectl apply -f k8s/serviceaccount.yaml
          fi

      - name: Secret da aplicação
        if: ${{ inputs.sync_app_secret }}
        env:
          SECRET_NAME: ${{ inputs.k8s_secret_name }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          CONNECTION_STRING_SM: ${{ inputs.connection_string_sm_secret }}
          SERVICE_AUTH_SM: ${{ inputs.service_auth_sm_secret }}
          JWT_SIGNING_KEY_SM: ${{ inputs.jwt_signing_key_sm_secret }}
          MERCADO_PAGO_ACCESS_TOKEN_SM: ${{ inputs.mercado_pago_access_token_sm_secret }}
          MERCADO_PAGO_WEBHOOK_SECRET_SM: ${{ inputs.mercado_pago_webhook_secret_sm_secret }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          SERVICE_AUTH_KEY: ${{ secrets.SERVICE_AUTH_KEY }}
        run: |
          set -euo pipefail
          secret_name="${SECRET_NAME:-$DEPLOYMENT_NAME}"
          from_args=()

          if [[ -z "${DD_API_KEY}" ]]; then
            echo "secret DD_API_KEY faltando (org/repo)" >&2
            exit 1
          fi
          echo "::add-mask::$DD_API_KEY"
          from_args+=(--from-literal=DD_API_KEY="$DD_API_KEY")

          if [[ -n "${CONNECTION_STRING_SM}" ]]; then
            connection_string="$(gcloud secrets versions access latest --secret="$CONNECTION_STRING_SM")"
            echo "::add-mask::$connection_string"
            from_args+=(--from-literal=ConnectionStrings__DefaultConnection="$connection_string")
          fi

          if [[ -n "${SERVICE_AUTH_SM}" ]]; then
            service_auth="$(gcloud secrets versions access latest --secret="$SERVICE_AUTH_SM")"
          else
            service_auth="${SERVICE_AUTH_KEY}"
          fi
          if [[ -z "${service_auth}" ]]; then
            echo "ServiceAuth faltando: informe service_auth_sm_secret ou o org secret SERVICE_AUTH_KEY" >&2
            exit 1
          fi
          echo "::add-mask::$service_auth"
          from_args+=(--from-literal=ServiceAuth__Key="$service_auth")

          if [[ -n "${JWT_SIGNING_KEY_SM}" ]]; then
            jwt_signing_key="$(gcloud secrets versions access latest --secret="$JWT_SIGNING_KEY_SM")"
            echo "::add-mask::$jwt_signing_key"
            from_args+=(--from-literal=Jwt__SigningKeyPem="$jwt_signing_key")
          fi

          if [[ -n "${MERCADO_PAGO_ACCESS_TOKEN_SM}" ]]; then
            mercado_pago_access_token="$(gcloud secrets versions access latest --secret="$MERCADO_PAGO_ACCESS_TOKEN_SM")"
            echo "::add-mask::$mercado_pago_access_token"
            from_args+=(--from-literal=MercadoPago__AccessToken="$mercado_pago_access_token")
          fi

          if [[ -n "${MERCADO_PAGO_WEBHOOK_SECRET_SM}" ]]; then
            mercado_pago_webhook_secret="$(gcloud secrets versions access latest --secret="$MERCADO_PAGO_WEBHOOK_SECRET_SM")"
            echo "::add-mask::$mercado_pago_webhook_secret"
            from_args+=(--from-literal=MercadoPago__WebhookSecret="$mercado_pago_webhook_secret")
          fi

          kubectl create secret generic "$secret_name" \
            --namespace "$K8S_NAMESPACE" \
            "${from_args[@]}" \
            --dry-run=client -o yaml \
          | kubectl apply -f -

      - name: Aplicar manifests
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
          DD_SITE: ${{ vars.DD_SITE }}
          DD_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          export IMAGE DD_VERSION
          export DD_SITE="${DD_SITE:-datadoghq.com}"

          apply_rendered() {
            local src="$1"
            local vars="$2"
            local out
            out="$(mktemp)"
            envsubst "$vars" < "$src" > "$out"
            kubectl apply -f "$out"
          }

          if [[ -f k8s/configmap.yaml ]]; then
            apply_rendered k8s/configmap.yaml '${DD_SITE}'
          fi
          if [[ -f k8s/deployment.yaml ]]; then
            apply_rendered k8s/deployment.yaml '${IMAGE} ${DD_VERSION}'
          fi
          for manifest in k8s/service.yaml k8s/hpa.yaml k8s/httproute.yaml k8s/healthcheckpolicy.yaml; do
            if [[ -f "$manifest" ]]; then
              kubectl apply -f "$manifest"
            fi
          done

          kubectl rollout status "deployment/${{ inputs.deployment_name }}" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=10m

      - name: Smoke HTTPS
        env:
          SMOKE_URL: ${{ inputs.smoke_url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 10 "$SMOKE_URL" >/dev/null; then
              {
                echo "## Serviço no ar"
                echo ""
                echo "- Smoke: \`$SMOKE_URL\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done

          echo "Smoke HTTPS falhou após ~15 min: $SMOKE_URL" >&2
          kubectl get httproute --namespace "$K8S_NAMESPACE" >&2 || true
          kubectl describe "deployment/${{ inputs.deployment_name }}" --namespace "$K8S_NAMESPACE" >&2 || true
          exit 1
